<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>inVestia Home – Coming Soon</title>
  <meta name="description" content="inVestia Home – Unsere neue Website entsteht gerade. Bald mehr." />

  <!-- Open Graph / Social preview -->
  <meta property="og:title" content="inVestia Home – Coming Soon" />
  <meta property="og:description" content="Unsere neue Website entsteht gerade." />
  <meta property="og:image" content="assets/logo.png" />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/png" href="assets/logo.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream: #F5F1EA;
      --cream-dark: #ECE6DB;
      --ink: #1c1c1c;
      --gold: #A9884F;
      --gold-soft: #b89a63;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6vh 24px;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* subtiler warmer Verlauf im Hintergrund */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(130% 100% at 50% 32%, rgba(245,241,234,0) 0%, rgba(236,230,219,0.25) 68%, rgba(230,222,208,0.5) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 100%;
      max-width: 520px;
      height: auto;
      /* Logo hat bereits Cremehintergrund -> nahtlos, kein Rahmen nötig */
    }

    .divider {
      width: 54px;
      height: 1px;
      background: var(--gold);
      opacity: .8;
      margin: 30px 0 26px;
    }

    .tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.25rem, 2.6vw, 1.7rem);
      color: var(--ink);
      letter-spacing: .01em;
      line-height: 1.4;
    }

    .subtag {
      margin-top: 12px;
      font-weight: 300;
      font-size: clamp(.72rem, 1.6vw, .82rem);
      letter-spacing: .32em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* Team-Foto dezent */
    .photo {
      margin-top: 52px;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 18px 46px -22px rgba(60,48,30,0.45);
      opacity: 0;
      animation: rise 1.2s cubic-bezier(.2,.7,.2,1) .35s forwards;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 22%;
      display: block;
      filter: saturate(.92) contrast(1.02);
      transition: transform 6s ease;
    }

    .photo:hover img { transform: scale(1.04); }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 46px;
      font-weight: 300;
      font-size: .72rem;
      letter-spacing: .12em;
      color: rgba(28,28,28,.45);
    }

    @media (max-width: 480px) {
      .photo { margin-top: 40px; }
      .divider { margin: 24px 0 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wrap, .photo { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="logo" src="assets/logo.png" alt="inVestia Home – Coming Soon" />

    <div class="divider"></div>

    <p class="tagline">Unsere neue Website entsteht gerade.</p>
    <p class="subtag">Bald für Sie da</p>

    <figure class="photo">
      <img src="assets/team.jpg" alt="Das Team von inVestia Home" loading="lazy" />
    </figure>
  </main>

  <footer>&copy; <span id="y"></span> inVestia Home</footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
